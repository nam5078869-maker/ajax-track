<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAX 트랙 매칭</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">AJAX TRACK</a>
    <nav>
      <a href="beats.html">비트 게시판</a>
      <a href="teams.html">팀 현황</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>AJAX 26-2 조별음원</h1>
      <p>비트를 공유하고, 같이 작업할 멤버를 찾고, 무대에 올릴 곡을 완성하세요.</p>
      <a href="beats.html" class="btn">비트 보러 가기</a>
    </section>

    <section class="steps">
      <h2>진행 방식</h2>
      <div class="step-list">
        <div class="step">
          <span class="num">01</span>
          <h3>비트 공유</h3>
          <p>작업하고 싶은 비트를 올리고 모집글을 작성해요.</p>
        </div>
        <div class="step">
          <span class="num">02</span>
          <h3>팀 구성</h3>
          <p>마음에 드는 비트에 참여 신청을 보내요.</p>
        </div>
        <div class="step">
          <span class="num">03</span>
          <h3>녹음</h3>
          <p>멘토 스튜디오에서 녹음을 진행해요.</p>
        </div>
        <div class="step">
          <span class="num">04</span>
          <h3>무대</h3>
          <p>완성한 트랙으로 축제와 정기공연 무대에 올라요.</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 AJAX Hip-hop Club</p>
  </footer>
</body>
</html>
